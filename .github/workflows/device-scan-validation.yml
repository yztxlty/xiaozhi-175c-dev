name: Device Scan Validation
on:
  push:
    branches: [main, feature/esp32-device-wifi-scan-20260917]
    paths:
      - 'main/boards/common/ygsoul*'
      - 'main/application.cc'
      - 'tests/**'
      - '.github/workflows/device-scan-validation.yml'
  pull_request:
    paths:
      - 'main/boards/common/ygsoul*'
      - 'main/application.cc'
      - 'tests/**'
      - '.github/workflows/device-scan-validation.yml'
permissions:
  contents: read
concurrency:
  group: device-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host test runner
        run: python -m pip install pytest==8.3.5
      - name: Archive protocol sources
        run: |
          python3 - <<'PY'
          import os, pathlib, tarfile
          with tarfile.open(os.environ['RUNNER_TEMP'] + '/firmware-review.tgz', 'w:gz') as output:
              for name in ['AGENTS.md', 'main/boards/common', 'main/application.cc', 'tests', 'main/idf_component.yml', 'main/CMakeLists.txt', 'CMakeLists.txt', 'sdkconfig.defaults', '.github/workflows']:
                  if pathlib.Path(name).exists(): output.add(name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-review-${{ github.sha }}
          path: ${{ runner.temp }}/firmware-review.tgz
          retention-days: 3
      - name: Execute host protocol and pairing receipt tests (not an ESP-IDF build)
        run: python -m pytest -v tests/test_device_wifi_scan.py tests/test_pairing_receipt.py --junitxml="$RUNNER_TEMP/host-protocol.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-protocol-${{ github.sha }}
          path: ${{ runner.temp }}/host-protocol.xml
          if-no-files-found: error
          retention-days: 7
