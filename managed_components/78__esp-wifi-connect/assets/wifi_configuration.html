<!DOCTYPE html>
<html>
<head>
    <title>Network Configuration</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style type="text/css">
        /* ========== Base Styles ========== */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        /* ========== Form Elements ========== */
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 3px;
            padding: 10px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        input[type="submit"]:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #remember_bssid, #sleep_mode {
            width: auto;
        }

        /* ========== AP List Styles ========== */
        #ap_list {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        #ap_list .scanning {
            font-style: italic;
            color: #666;
        }
        #ap_list a {
            display: block;
            margin-top: 5px;
            color: #007bff;
            text-decoration: none;
        }
        #ap_list a:hover {
            text-decoration: underline;
        }

        /* ========== Language Switcher ========== */
        .language-switch {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .language-switch select {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        /* ========== Tab Styles ========== */
        .tabs {
            display: flex;
            margin-top: 20px;
            margin-bottom: 0;
            padding-left: 20px;
            border-bottom: 1px solid #ccc;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            margin-right: 5px;
            background-color: #f0f0f0;
            position: relative;
            top: 1px;
        }
        .tab.active {
            background-color: #fff;
        }
        .tab-content {
            display: none;
            border-top: none;
            padding: 20px;
            background-color: #fff;
        }
        .tab-content.active {
            display: block;
        }

        /* ========== Toast Message Styles ========== */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            min-width: 200px;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
        }

        /* ========== Loading Spinner Styles ========== */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .loading-text {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

            color: #fff;
            font-size: 15px;
            font-weight: 650;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #a296ff, #7967de);
            box-shadow: 0 10px 24px rgba(121, 103, 222, .28);
        }
        input[type="submit"] { width: 100%; }
        input[type="submit"]:hover, button:hover { filter: brightness(1.08); }
        input[type="submit"]:disabled, button:disabled {
            opacity: .52;
            cursor: not-allowed;
        }
        #ap_list {
            display: grid;
            gap: 8px;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(179, 201, 239, .18);
        }
        #ap_list > p {
            margin: 0 0 4px;
            color: var(--yg-muted);
            font-size: 13px;
            text-align: center;
        }
        #ap_list .scanning {
            color: var(--yg-cyan);
            text-align: center;
        }
        #ap_list a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 46px;
            margin: 0;
            padding: 0 14px;
            color: var(--yg-text);
            text-decoration: none;
            border: 1px solid rgba(179, 201, 239, .22);
            border-radius: 13px;
            background: rgba(61, 81, 119, .38);
        }
        #ap_list a:hover, #ap_list a:focus {
            color: #fff;
            border-color: rgba(138, 216, 232, .7);
            background: rgba(89, 104, 153, .48);
        }
        .error {
            min-height: 20px;
            margin: 8px 0 2px;
            color: var(--yg-danger) !important;
            font-size: 13px;
        }
        .toast {
            top: auto;
            right: 18px;
            bottom: 18px;
            left: 18px;
            transform: none;
            min-width: 0;
            padding: 14px 18px;
            color: var(--yg-text);
            border: 1px solid var(--yg-line);
            background: rgba(25, 37, 62, .94);
            box-shadow: 0 16px 34px rgba(0,0,0,.3);
        }
        .loading-overlay {
            background: rgba(10, 16, 31, .68);
            backdrop-filter: blur(8px);
        }
        .loading-spinner {
            border-color: rgba(255,255,255,.18);
            border-top-color: var(--yg-cyan);
            border-right-color: var(--yg-primary);
        }
        .loading-text {
            color: var(--yg-text);
            font-size: 16px;
            font-weight: 500;
        }
        #advanced-tab form > div {
            display: grid;
            gap: 14px;
        }
        #advanced-tab form p { margin: 0; }
        #advanced-tab input[type="checkbox"] {
            min-height: auto;
            accent-color: var(--yg-primary);
        }
        #advanced-tab button[type="button"] {
            min-height: 42px;
            padding: 0 14px;
            background: rgba(242, 168, 197, .18);
            box-shadow: none;
        }
        @media (max-width: 520px) {
            body::before { top: 28px; width: 124px; height: 124px; }
            body::after { top: 164px; }
            .tabs { margin-top: 198px; }
            .tab-content { padding-top: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

            'sl': 'sl-SI', 'sl-SI': 'sl-SI',
            // Serbian
            'sr': 'sr-RS', 'sr-RS': 'sr-RS',
            // Swedish
            'sv': 'sv-SE', 'sv-SE': 'sv-SE',
            // Thai
            'th': 'th-TH', 'th-TH': 'th-TH',
            // Turkish
            'tr': 'tr-TR', 'tr-TR': 'tr-TR',
            // Ukrainian
            'uk': 'uk-UA', 'uk-UA': 'uk-UA',
            // Vietnamese
            'vi': 'vi-VN', 'vi-VN': 'vi-VN',
            // Chinese
            'zh': 'zh-CN', 'zh-CN': 'zh-CN', 'zh-TW': 'zh-TW', 'zh-HK': 'zh-TW'
        };

        // ========== Helper Functions ==========

        /**
         * Get supported language code from browser language
         */
        function getSupportedLanguage(lang) {
            // First try exact match
            if (languageMap[lang]) {
                return languageMap[lang];
            }
            // Then try to match only the main language code
            const mainLang = lang.split('-')[0];
            if (languageMap[mainLang]) {
                return languageMap[mainLang];
            }
            // If no match, return English
            return 'en-US';
        }

        /**
         * Change the page language
         */
        function changeLanguage() {
            const lang = document.getElementById('language').value;

            // Check if language is valid
            if (!translations[lang]) {
                console.warn(`Unsupported language: ${lang}, defaulting to English`);
                document.getElementById('language').value = 'en-US';
                return changeLanguage();
            }

            // Set page title
            document.title = translations[lang].title;

            // Update text content
            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                element.textContent = translations[lang][key];
            });

            // Update input values
            document.querySelectorAll('[data-lang-value]').forEach(element => {
                const key = element.getAttribute('data-lang-value');
                element.value = translations[lang][key];
            });

            // Update AP list text based on 5G support
            const apList = document.getElementById('ap_list');
            if (apList.firstChild) {
                const selectText = support5G ? translations[lang].select_wifi_5g : translations[lang].select_wifi;
                apList.firstChild.textContent = selectText;
            }

            // Save language preference
            localStorage.setItem('preferred_language', lang);
        }

        // ========== Wi-Fi List Management ==========

        /**
         * Render saved Wi-Fi list
         */
        function renderSavedList(data) {
            const savedListContainer = document.getElementById('saved_list_container');
            const savedList = document.getElementById('saved_list');
            savedList.innerHTML = '';

            data.forEach((ssid, index) => {
                const li = document.createElement('li');
                let html = `<span>${ssid}</span>`;

                // Only add priority and delete buttons after the first item
                if (index > 0) {
                    html += ` <span>
                        <button type="button" onclick="setDefaultItem(this, ${index})">⬆️</button>
                        <button type="button" onclick="deleteItem(this, ${index})">❌</button>
                    </span>`;
                } else {
                    html += ` <span><button type="button" onclick="deleteItem(this, ${index})">❌</button></span>`;
                }

                li.innerHTML = html;
                savedList.appendChild(li);
            });

            // Show/hide container based on whether there are saved networks
            savedListContainer.style.display = data.length > 0 ? 'block' : 'none';
        }

        /**
         * Delete saved Wi-Fi network
         */
        function deleteItem(item, index) {
            item.disabled = true;
            fetch('/saved/delete?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        /**
         * Set default Wi-Fi network (move to top)
         */
        function setDefaultItem(item, index) {
            item.disabled = true;
            fetch('/saved/set_default?index=' + index)
                .then(response => response.json())
                .then(data => {
                    loadSavedList();
                });
        }

        /**
         * Load saved Wi-Fi list from server
         */
        function loadSavedList() {
            fetch('/saved/list')
                .then(response => response.json())
                .then(data => {
                    renderSavedList(data);
                });
        }

        /**
         * Load available Wi-Fi networks
         */
        function loadAPList() {
            if (button.disabled) {
                return;
            }

            const lang = document.getElementById('language').value;
            const apList = document.getElementById('ap_list');

            // Check if AP list already has content
            const hasExistingAPs = apList.querySelector('a') !== null;

            // Only show scanning text if there's no existing AP list
            if (!hasExistingAPs) {
                apList.innerHTML = '<p class="scanning">' + translations[lang].scanning + '</p>';
            }

            fetch('/scan')
                .then(response => response.json())
                .then(data => {
                    // Update global 5G support status
                    support5G = data.support_5g;

                    // Use select_wifi_5g if 5G is supported, otherwise use select_wifi
                    const selectText = support5G ? translations[lang].select_wifi_5g : translations[lang].select_wifi;
                    apList.innerHTML = '<p>' + selectText + '</p>';

                    // Iterate through available APs
                    data.aps.forEach(ap => {
                        const link = document.createElement('a');
                        link.href = '#';
                        link.textContent = ap.ssid + ' (' + ap.rssi + ' dBm)';

                        // Add lock icon for secured networks
                        if (ap.authmode === 0) {
                            link.textContent += ' 🌐';
                        } else {
                            link.textContent += ' 🔒';
                        }

                        link.addEventListener('click', () => {
                            ssid.value = ap.ssid;
                        });

                        apList.appendChild(link);
                    });

                    // Refresh AP list every 5 seconds
                    setTimeout(loadAPList, 5000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    // On error, try again after 5 seconds
                    setTimeout(loadAPList, 5000);
                });
        }

        // ========== Form Submission ==========

        /**
         * Submit Wi-Fi connection form
         */
        async function submitForm(event) {
            event.preventDefault();
            button.disabled = true;
            error.textContent = '';

            // Show loading animation
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('show');

            const payload = {
                ssid: ssid.value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Connection failed');
                }

                // Connection successful, redirect to done page
                button.disabled = false;
                window.location.href = '/done.html';
            } catch (err) {
                // Hide loading animation on error
                loadingOverlay.classList.remove('show');
                error.textContent = err.message;
                button.disabled = false;
            }
        }

        /**
         * Submit advanced configuration form
         */
        async function submitAdvancedForm(event) {
            event.preventDefault();
            const advancedButton = document.getElementById('advanced_button');
            const advancedError = document.getElementById('advanced_error');
            advancedButton.disabled = true;
            advancedError.textContent = '';

            const config = {
                ota_url: document.getElementById('ota_url').value,
                max_tx_power: parseInt(document.getElementById('max_tx_power').value),
                remember_bssid: document.getElementById('remember_bssid').checked,
                sleep_mode: document.getElementById('sleep_mode').checked
            };

            try {
                const response = await fetch('/advanced/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Save failed');
                }

                advancedButton.disabled = false;
                showToast('Configuration saved');
            } catch (err) {
                advancedError.textContent = err.message;
                advancedButton.disabled = false;
            }
        }

        // ========== UI Functions ==========

        /**
         * Switch between tabs
         */
        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab content
            document.getElementById(tabName + '-tab').classList.add('active');

            // Activate selected tab
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`).classList.add('active');
        }

        /**
         * Show toast notification
         */
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /**
         * Load advanced configuration from server
         */
        async function loadAdvancedConfig() {
            try {
                const response = await fetch('/advanced/config');
                const data = await response.json();

                if (data.ota_url) {
                    document.getElementById('ota_url').value = data.ota_url;
                }
                if (data.max_tx_power) {
                    document.getElementById('max_tx_power').value = data.max_tx_power;
                }
                if (data.remember_bssid !== undefined) {
                    document.getElementById('remember_bssid').checked = data.remember_bssid;
                }
                if (data.sleep_mode !== undefined) {
                    document.getElementById('sleep_mode').checked = data.sleep_mode;
                }
            } catch (error) {
                console.error('Error loading advanced config:', error);
            }
        }

        /**
         * Clear OTA URL input field
         */
        function clearOtaUrl() {
            document.getElementById('ota_url').value = '';
        }

        // ========== Initialization ==========

        /**
         * Initialize page on DOM load
         */
        document.addEventListener('DOMContentLoaded', () => {
            // Get language setting from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');

            // Get browser language
            const browserLang = navigator.language || navigator.userLanguage;

            // Priority: URL parameter > local storage > browser language setting
            const savedLang = langParam ||
                             localStorage.getItem('preferred_language') ||
                             getSupportedLanguage(browserLang);

            document.getElementById('language').value = savedLang;
            changeLanguage();
            loadSavedList();
            loadAPList();
            loadAdvancedConfig();
        });

        /**
         * Handle browser back button
         */
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                loadSavedList();
            }
        });

        /**
         * Enable SSID input (fix iOS bug)
         */
        ssid.addEventListener('touchstart', () => {
            ssid.removeAttribute('readonly');
            ssid.focus();
        }, {once: true});
    </script>
</body>
</html>
