    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            color: #f4f5ff;
            background:
                radial-gradient(circle at 50% 18%, rgba(115, 134, 220, .34), transparent 35%),
                linear-gradient(145deg, #0b1122, #10172a 55%, #17233a);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        }
        .container {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 28px 18px;
        }
        .panel {
            width: min(520px, 100%);
            padding: 32px 24px 26px;
            text-align: center;
            border: 1px solid rgba(179, 201, 239, .34);
            border-radius: 26px;
            background: rgba(37, 51, 77, .76);
            box-shadow: 0 20px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.1);
            backdrop-filter: blur(22px);
        }
        .brand-logo {
            width: 124px;
            height: 124px;
            object-fit: contain;
            filter: drop-shadow(0 0 24px rgba(142, 124, 244, .45));
            mix-blend-mode: screen;
        }
        .brand { margin: 10px 0 30px; color: rgba(244,245,255,.72); font-size: 12px; letter-spacing: .34em; }
        .checkmark { width: 92px; height: 92px; margin: 0 auto 20px; }
        .checkmark__circle { fill: rgba(138,216,232,.12); stroke: #8ad8e8; stroke-width: 1.6; }
        .checkmark__check { stroke: #f4f5ff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        h1 { margin: 0 0 10px; font-size: 26px; font-weight: 650; }
        p { margin: 0; color: #b8c4dc; font-size: 15px; line-height: 1.7; }
        .hint { margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(179,201,239,.18); font-size: 13px; }
        @media (max-width: 420px) { .panel { padding: 26px 18px 22px; } h1 { font-size: 23px; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                fetch('/exit', { method: 'POST' })
                    .then(function(response) {
                        if (!response.ok) console.error('Failed to send exit config mode request');
                    })
                    .catch(function(error) { console.error('Error:', error); });
            }, 1000);
        });
